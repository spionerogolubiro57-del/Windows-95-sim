<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 95 Simulator — Уведомление</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #008080; /* Классический бирюзовый фон рабочего стола Win95 */
      font-family: "MS Sans Serif", Tahoma, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }

    /* Главное окно Windows 95 */
    .win95-window {
      background-color: #c0c0c0;
      width: 100%;
      max-width: 460px;
      padding: 3px;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080, 4px 4px 10px rgba(0, 0, 0, 0.35);
    }

    /* Синяя шапка окна без крестика */
    .win95-titlebar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      letter-spacing: 0.3px;
    }

    /* Содержимое окна */
    .win95-content {
      padding: 20px 22px 24px;
      text-align: center;
    }

    /* Аккуратный баннер с логотипом GitHub */
    .github-banner {
      background-color: #f4f4f4; /* Точный цвет фона самой картинки */
      padding: 4px 12px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0px #000000;
    }

    .github-banner img {
      height: 54px;
      width: auto;
      display: block;
      mix-blend-mode: multiply; /* Убирает малейшую разницу оттенков фона */
    }

    /* Крупный жирный заголовок */
    .headline {
      font-size: 22px;
      font-weight: bold;
      color: #000000;
      margin-bottom: 12px;
    }

    /* Основной текст помельче */
    .subtext {
      font-size: 14px;
      line-height: 1.45;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="win95-window">
    <!-- Заголовок окна -->
    <div class="win95-titlebar">
      <span>Системное сообщение</span>
    </div>

    <!-- Внутренняя часть -->
    <div class="win95-content">
      <!-- Баннер с логотипом -->
      <div class="github-banner">
        <img src="https://brand.github.com/_next/static/media/logo-03.cc5e5332.png" alt="GitHub Logo">
      </div>

      <!-- Крупная жирная надпись -->
      <div class="headline">Дорогие пользователи!</div>

      <!-- Текст помельче -->
      <div class="subtext">
        В связи с возникшими проблемами с нашим аккаунтом GitHub работа Windows 95 Simulator временно приостановлена!
      </div>
    </div>
  </div>

</body>
</html>
